name: BetterBedrockMenus
website: https://pbsi.xyz
description: This plugin allows server owners to create Bedrock native menus on java crossplay servers!
version: '0.5.5'
main: xyz.pbsi.betterBedrockMenus.BetterBedrockMenus
api-version: '1.21'
prefix: BBM
depend: ["Geyser-Spigot", "floodgate"]
softdepend: ["PlaceholderAPI"]
commands:
  BetterBedrockMenus:
    description: Provides basic info about the plugin.
  Send-Command-Menu:
    description: Sends a menu to a specified player.
    usage: "§7/§fSend-Menu §7<§fPlayer§7> <§fTitle§7> §7<§fContent§7> §7| §8[§fSends a menu with the values defined within the command!§8]"
    permission: bbm.send
  Create-Menu:
    description: Creates a menu and stores it within a file.
    usage: "§7/§fSend-Menu §7<§fFile Name§7> <§fTitle§7> §7<§fContent§7> §7| §8[§fCreates a menu with the values defined within the command!§8]"
    permission: bbm.create
  Delete-Menu:
    description: Deletes a menu.
    usage: "§7/§fDelete-Menu §7<§fFile Name§7> §7| §8[§fDeletes a menu.§8]"
    permission: bbm.delete
  Send-Menu:
    description: Sends a menu out of the list of pre-made ones.
    usage: "§7/§fSend-Menu §7<§fFile Name§7> §7<§fUsername§7> §7| §8[§fSends a menu to a player.§8]"
    permission: bbm.send
  Menu-Creator:
    permission: bbm.create
    description: GUI for creating bedrock menus.
    usage: /Menu-Creator
  Open-Menu:
    description: Opens a menu to the player that sent it, can be enabled and disabled in the config.
    usage: /Open-Menu <Menu Name>
  Edit-Menu:
    description: Edits a menu.
    permission: bbm.edit
    usage: "§7/§fEdit-Menu §7<§fFile Name§7> §7<§fField§7> §7<f§New Value§7> §7| §8[§fEdits a field within a menu.§8]"
  List-Menus:
    description: Lists all the menus.
    permission: bbm.list